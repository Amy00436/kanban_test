name: CI and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PAGES: index.html v2/index.html
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pages exist and parse
        run: |
          for f in $PAGES; do
            test -f "$f" || { echo "::error::$f is missing"; exit 1; }
            python3 -c "import html.parser,sys; html.parser.HTMLParser().feed(open(sys.argv[1], encoding='utf-8').read())" "$f"
          done

      - name: No forbidden APIs
        run: |
          if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie|<script src|<link|!important|alert\(|confirm\(' $PAGES; then
            echo "::error::Forbidden API or pattern found (see CLAUDE.md)"
            exit 1
          fi

      - name: No real-bank branding
        run: |
          if grep -niwE 'UOB' $PAGES; then
            echo "::error::Real bank name found"
            exit 1
          fi

      - name: Only the placeholder email address
        run: |
          if grep -HnoE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' $PAGES | grep -v ':YOUR_EMAIL@example\.com$'; then
            echo "::error::Email address other than YOUR_EMAIL@example.com found"
            exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files (v1 at /, v2 at /v2/ only)
        run: |
          mkdir -p _site/v2
          cp index.html _site/
          cp v2/index.html _site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
